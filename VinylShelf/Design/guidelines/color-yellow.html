<!-- @dsCard group="Colors" viewport="700x150" name="Signature yellow" subtitle="The record label — CTAs, active state, sparks" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-body); background: var(--bg-app); color: var(--text-on-yellow); }
  .row { display:flex; gap:10px; padding:20px; }
  .sw { flex:1; border-radius: var(--radius-md); height:96px; display:flex; flex-direction:column; justify-content:flex-end; padding:10px; }
  .name { font-family: var(--font-mono); font-size:11px; letter-spacing:.04em; }
  .hex { font-family: var(--font-mono); font-size:11px; opacity:.7; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--yellow-700)"><div class="name" style="color:#070A16">yellow-700</div><div class="hex">#C98A0A</div></div>
    <div class="sw" style="background:var(--yellow-600)"><div class="name">yellow-600</div><div class="hex">#E9A712</div></div>
    <div class="sw" style="background:var(--yellow-500); box-shadow: var(--glow-yellow)"><div class="name">yellow-500</div><div class="hex">#FFC93C</div></div>
    <div class="sw" style="background:var(--yellow-400)"><div class="name">yellow-400</div><div class="hex">#FFD65E</div></div>
    <div class="sw" style="background:var(--yellow-300)"><div class="name">yellow-300</div><div class="hex">#FFE596</div></div>
  </div>
</body>
</html>
