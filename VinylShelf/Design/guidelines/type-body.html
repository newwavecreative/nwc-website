<!-- @dsCard group="Type" viewport="700x210" name="Body — DM Sans" subtitle="UI text and reading copy at three sizes" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:22px; font-family: var(--font-body); background: var(--bg-app); color: var(--text-primary); }
  .b { line-height: var(--lh-normal); margin-bottom:12px; max-width: 560px; }
  .l  { font-size: var(--text-body-l); }
  .m  { font-size: var(--text-body); color: var(--text-secondary); }
  .s  { font-size: var(--text-body-s); color: var(--text-muted); }
  .meta { font-family: var(--font-mono); font-size:10px; color: var(--text-muted); letter-spacing:.04em; }
</style>
</head>
<body>
  <div class="b l">Filed on the shelf. Your first pressing is safe. <span class="meta">· Body L 17px</span></div>
  <div class="b m">Search artists, albums, or catalog numbers to add records to your collection. <span class="meta">· Body 15px</span></div>
  <div class="b s">Added 3 days ago · Reissue · Near Mint <span class="meta">· Body S 13px</span></div>
</body>
</html>
