<!-- @dsCard group="Type" viewport="700x200" name="Display — Bricolage Grotesque" subtitle="Playful headings, screen titles, big numerals" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:22px; font-family: var(--font-display); background: var(--bg-app); color: var(--text-primary); }
  .xl { font-size: var(--text-display-l); font-weight: var(--fw-extra); letter-spacing: var(--ls-tight); line-height: var(--lh-tight); }
  .l  { font-size: var(--text-display-m); font-weight: var(--fw-bold); letter-spacing: var(--ls-tight); }
  .meta { font-family: var(--font-mono); font-size:11px; color: var(--text-muted); letter-spacing:.04em; margin-top:4px; }
  .row { display:flex; align-items:baseline; gap:24px; margin-bottom:14px; }
</style>
</head>
<body>
  <div class="xl">Your shelf, spinning.</div>
  <div class="meta">Display L · 34px · 800 · tracking −0.02em</div>
  <div class="l" style="margin-top:16px; color: var(--yellow-500)">Now Spinning</div>
  <div class="meta">Display M · 26px · 700</div>
</body>
</html>
