<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:22px; font-family: var(--font-mono); background: var(--bg-app); color: var(--text-primary); }
  .lbl { font-size:11px; letter-spacing: var(--ls-caps); text-transform:uppercase; color: var(--text-muted); }
  .val { font-size:15px; color: var(--yellow-500); margin-top:2px; }
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:18px; }
</style>
</head>
<body>
  <div class="grid">
    <div><div class="lbl">Catalog no.</div><div class="val">BLP&nbsp;1577</div></div>
    <div><div class="lbl">Pressing</div><div class="val">1959</div></div>
    <div><div class="lbl">Runtime</div><div class="val">42:17</div></div>
    <div><div class="lbl">Format</div><div class="val">2×LP</div></div>
  </div>
</body>
</html>
