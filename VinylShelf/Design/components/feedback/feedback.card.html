<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { margin:0; padding:22px; font-family: var(--font-body); background: var(--grad-app); color: var(--text-primary); }
  .wrap { display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap; }
  .stack { display:flex; flex-direction:column; gap:12px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Toast, Dialog, Button } = window.VinylShelfDesignSystem_aa4cb5;
    const Ico = ({n}) => <i data-lucide={n} style={{width:18,height:18}}></i>;
    function Demo() {
      React.useEffect(() => { if (window.lucide) lucide.createIcons(); });
      return (
        <div className="wrap">
          <div className="stack">
            <Toast message="Filed on the shelf" tone="owned" icon={<Ico n="check"/>} />
            <Toast message="On the hunt" tone="wishlist" icon={<Ico n="heart"/>} />
            <Toast message="Shelf shared with Mia" tone="blue" icon={<Ico n="share-2"/>} />
          </div>
          <div style={{position:'relative', width:360, height:230, borderRadius:'var(--radius-lg)', overflow:'hidden', border:'1px solid var(--border-subtle)'}}>
            <Dialog open title="Remove from shelf?"
              style={{position:'absolute'}}
              actions={<>
                <Button variant="ghost">Keep</Button>
                <Button variant="danger">Remove</Button>
              </>}>
              This record will leave your collection. You can always add it back later.
            </Dialog>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>
